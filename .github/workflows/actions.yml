name: Github CI
on: [push]

jobs:
  week1-tests:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Install Codon
        run: |
          mkdir -p ${HOME}/.codon
          curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz | tar zxvf - --strip-components=1 -C ${HOME}/.codon
          curl -L https://github.com/exaloop/seq/releases/download/v0.11.5/seq-linux-x86_64.tar.gz | tar zxvf - -C ${HOME}/.codon/lib/codon/plugins
          export PATH=${PATH}:${HOME}/.codon/bin
      - name: Check out repository code
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up Codon Python bridge
        run: |
          pip install find_libpython
          export CODON_PYTHON=$(find_libpython)
          echo "Found Python at: ${CODON_PYTHON}"
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bc

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib find_libpython
          
      - name: Persist CODON_PYTHON
        run: |
          echo "CODON_PYTHON=$(find_libpython)" >> $GITHUB_ENV

      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."

      - name: Verify Codon on PATH
        run: |
          echo "PATH=$PATH"
          ls -lah "$HOME/.codon/bin" || true
          command -v codon || true

  week2-tests:
    name: Week 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Codon
        run: |
          mkdir -p ${HOME}/.codon
          curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz \
            | tar zxvf - --strip-components=1 -C ${HOME}/.codon
          curl -L https://github.com/exaloop/seq/releases/download/v0.11.5/seq-linux-x86_64.tar.gz \
            | tar zxvf - -C ${HOME}/.codon/lib/codon/plugins
          echo "$HOME/.codon/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest matplotlib distinctipy numpy trviz

      - name: Run evaluate.sh
        working-directory: week2_trviz
        run: |
          chmod +x evaluate.sh
          ./evaluate.sh
  week3-tests:
    name: Week 3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Codon
        run: |
          mkdir -p ${HOME}/.codon
          curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz \
            | tar zxvf - --strip-components=1 -C ${HOME}/.codon
          curl -L https://github.com/exaloop/seq/releases/download/v0.11.5/seq-linux-x86_64.tar.gz \
            | tar zxvf - -C ${HOME}/.codon/lib/codon/plugins
          echo "$HOME/.codon/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install find_libpython numpy matplotlib biotite pytest

      - name: Configure Codon Python bridge
        run: |
          export CODON_PYTHON=$(find_libpython)
          echo "CODON_PYTHON=$CODON_PYTHON" >> $GITHUB_ENV
          echo "✅ Found Python shared library at $CODON_PYTHON"

      - name: Run evaluate.sh
        working-directory: week3
        env:
          CODON_PYTHON: ${{ env.CODON_PYTHON }}
        run: |
          chmod +x evaluate.sh
          ./evaluate.sh
  week4-tests:
    name: Week 4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Codon
        run: |
          mkdir -p ${HOME}/.codon
          curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz \
            | tar zxvf - --strip-components=1 -C ${HOME}/.codon
          curl -L https://github.com/exaloop/seq/releases/download/v0.11.5/seq-linux-x86_64.tar.gz \
            | tar zxvf - -C ${HOME}/.codon/lib/codon/plugins
          echo "$HOME/.codon/bin" >> $GITHUB_PATH
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy find_libpython

      - name: Configure Codon bridge
        run: |
          export CODON_PYTHON=$(find_libpython)
          echo "CODON_PYTHON=$CODON_PYTHON" >> $GITHUB_ENV

      #- name: Run Week 4 evaluation
        #working-directory: week4 
        #run: |
          #chmod +x evaluate.sh
          #./evaluate.sh
  week5-tests:
    name: Run Week 5 Notebook
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq samtools bcftools minimap2 tabix bzip2
          pip install --quiet jupyter pandas numpy biopython whatshap nbconvert ipykernel
          python -m ipykernel install --user --name=python3

      - name: ▶️ Execute week5 notebook
        working-directory: week5
        run: |
          echo "🚀 Executing week5.ipynb..."
          jupyter nbconvert --to notebook --execute week5.ipynb \
            --output week5_output.ipynb \
            --ExecutePreprocessor.timeout=1800 || { echo "❌ Notebook execution failed"; exit 1; }
          echo "✅ Notebook executed successfully."

      - name: 📤 Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: week5_results
          path: |
            week5/week5_output.ipynb
            week5/data/*.tsv
            week5/data/*.bed
            week5/data/*.png










